name: Bug Report
description: Something is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `skim proxy --port 7474`
        2. Set `ANTHROPIC_BASE_URL=http://localhost:7474`
        3. Make an API call
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS: Ubuntu 24.04
        - Python: 3.12.3
        - skim version: 0.5.0  (run: skim version)
        - Component: proxy / server / adapter / CLI
        - Auth type: API key / Claude Pro OAuth
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output or error
      render: shell
