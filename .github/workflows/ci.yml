name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core deps
        run: pip install tiktoken pytest

      - name: Token budget check (≤ 40% of context)
        run: python3 core/check.py --path . --model claude --max-pct 40

      - name: Scan self-test
        run: python3 core/token_counter.py --path . --model generic

      - name: Analyzer self-test
        run: python3 core/context_analyzer.py --path . --model generic

      - name: Config generator dry-run
        run: python3 scripts/generate_config.py --output . --model all --dry-run

      - name: CLI dispatcher test
        run: |
          python3 core/cli.py scan --path . --model generic
          python3 core/cli.py check --path . --max-pct 60
          python3 core/cli.py version

      - name: Run tests
        run: pytest tests/ -v
