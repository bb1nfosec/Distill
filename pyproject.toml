[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distill-llm"
version = "0.1.0"
description = "Scan any codebase, see which files are burning your Claude/GPT tokens, and the exact dollar cost — with a CI budget gate and drop-in adapters for every major LLM."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "bbinfosec", email = "vickytestssec@gmail.com" }]
keywords = ["llm", "tokens", "token-optimization", "claude", "openai", "gemini", "ollama", "ai", "cost", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Operating System :: OS Independent",
]

# Core tools (scan, analyze, check) work with zero hard dependencies
dependencies = []

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7.0"]
claude   = ["anthropic>=0.40.0"]
openai   = ["openai>=1.50.0"]
gemini   = ["google-generativeai>=0.8.0"]
mcp      = ["mcp>=1.0.0"]
all      = ["tiktoken>=0.7.0", "anthropic>=0.40.0", "openai>=1.50.0", "google-generativeai>=0.8.0", "mcp>=1.0.0"]
dev      = ["pytest>=8.0.0", "tiktoken>=0.7.0"]

[project.urls]
Homepage   = "https://github.com/bb1nfosec/Distill"
Repository = "https://github.com/bb1nfosec/Distill"
Issues     = "https://github.com/bb1nfosec/Distill/issues"
Changelog  = "https://github.com/bb1nfosec/Distill/blob/main/CHANGELOG.md"
"Try Online" = "https://bb1nfosec.github.io/Distill"

[project.scripts]
distill         = "core.cli:main"
distill-scan    = "core.token_counter:main"
distill-analyze = "core.context_analyzer:main"
distill-check   = "core.check:main"
distill-mcp     = "distill_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "adapters*", "scripts*", "distill_mcp*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
