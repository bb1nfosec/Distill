[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skim-llm"
version = "0.3.0"
description = "Runtime token proxy + optimization toolkit for LLM developers and enterprises. Intercepts API calls, strips waste in real-time, tracks costs, and serves a web dashboard."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "bb1nfosec", email = "vickytestssec@gmail.com" }]
keywords = [
    "llm", "tokens", "token-optimization", "claude", "openai", "gemini", "ollama",
    "ai", "cost", "developer-tools", "proxy", "api-gateway", "context-window",
    "runtime", "enterprise", "dashboard",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Environment :: Console",
    "Operating System :: OS Independent",
]

# Core scanner + proxy work with zero hard dependencies
dependencies = []

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7.0"]
claude   = ["anthropic>=0.40.0"]
openai   = ["openai>=1.50.0"]
gemini   = ["google-generativeai>=0.8.0"]
mcp      = ["mcp>=1.0.0"]
web      = ["flask>=3.0.0"]
sso      = ["authlib>=1.3.0", "httpx>=0.27.0"]
ldap     = ["ldap3>=2.9.0"]
dev      = ["pytest>=8.0.0", "tiktoken>=0.7.0", "flask>=3.0.0"]
all      = [
    "tiktoken>=0.7.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
    "mcp>=1.0.0",
    "flask>=3.0.0",
]

[project.urls]
Homepage   = "https://github.com/bb1nfosec/skim"
Repository = "https://github.com/bb1nfosec/skim"
Issues     = "https://github.com/bb1nfosec/skim/issues"
Changelog  = "https://github.com/bb1nfosec/skim/blob/main/CHANGELOG.md"

[project.scripts]
skim            = "core.cli:main"
skim-scan       = "core.token_counter:main"
skim-analyze    = "core.context_analyzer:main"
skim-check      = "core.check:main"
skim-fix        = "core.fix:main"
skim-proxy      = "core.proxy:main"
skim-server     = "server.app:main"
skim-secrets    = "core.secrets_detector:main"
skim-audit      = "core.audit:main"
skim-mcp        = "skim_mcp.server:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["core*", "adapters*", "scripts*", "skim_mcp*", "server*"]

[tool.setuptools.package-data]
"server" = ["static/*.html", "static/*.css", "static/*.js"]
"*"      = ["py.typed"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length    = 100
target-version = "py310"
