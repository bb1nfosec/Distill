<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>skim — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
<style>
:root { --bg:#0a0c10; --surface:#111318; --border:#1e2130; --border2:#252a3a;
        --text:#e4e6f0; --muted:#6b7280; --accent:#6c63ff; --danger:#ff4d6d; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;
       min-height:100vh; display:flex; align-items:center; justify-content:center; }
.box { background:var(--surface); border:1px solid var(--border2); border-radius:14px;
       padding:40px; width:380px; box-shadow:0 4px 24px rgba(0,0,0,.5); }
h1   { font-size:22px; font-weight:800; margin-bottom:4px; letter-spacing:-.5px; }
.sub { color:var(--muted); font-size:13px; margin-bottom:28px; }
.field { margin-bottom:16px; }
.field label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; }
.field input { width:100%; background:var(--bg); border:1px solid var(--border);
               color:var(--text); padding:10px 12px; border-radius:8px; font-size:14px; }
.field input:focus { outline:none; border-color:var(--accent); }
.err { color:var(--danger); font-size:12px; margin-top:8px; display:none; }
.btn { width:100%; padding:11px; background:var(--accent); color:#fff;
       border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; margin-top:8px; }
.btn:hover { background:#5a52e0; }
.divider { text-align:center; color:var(--muted); font-size:12px; margin:20px 0;
           position:relative; }
.divider::before,.divider::after { content:''; position:absolute; top:50%;
  width:calc(50% - 20px); height:1px; background:var(--border); }
.divider::before { left:0; } .divider::after { right:0; }
.sso-btn { width:100%; padding:10px; border:1px solid var(--border); background:transparent;
           color:var(--text); border-radius:8px; font-size:13px; cursor:pointer;
           display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:10px; }
.sso-btn:hover { border-color:var(--accent); }
</style>
</head>
<body>
<div class="box">
  <h1>skim</h1>
  <div class="sub">Token Intelligence — sign in to your workspace</div>
  <div class="field">
    <label>Email</label>
    <input type="email" id="em" placeholder="you@company.com"/>
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="pw" placeholder="••••••••"/>
  </div>
  <div class="err" id="err">Invalid credentials.</div>
  <button class="btn" onclick="login()">Sign in</button>
  <div class="divider" id="sso-div" style="display:none">or</div>
  <div id="sso"></div>
</div>
<script>
const API = window.location.origin;
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
async function login() {
  const em = document.getElementById('em').value;
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.style.display='none';
  const r = await fetch(`${API}/api/v1/auth/login`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email:em, password:pw}),
  }).then(r=>r.json()).catch(()=>null);
  if(!r||r.error){ err.style.display='block'; return; }
  localStorage.setItem('skim_token', r.token);
  window.location='/dashboard';
}
(async () => {
  const r = await fetch(`${API}/api/v1/auth/oidc/providers`).then(r=>r.json()).catch(()=>null);
  if(!r||!r.providers.length) return;
  document.getElementById('sso-div').style.display='';
  const icons={google:'🔵',github:'⚫',azure:'🔷',custom:'🔐'};
  const lbls={google:'Google',github:'GitHub',azure:'Azure AD',custom:'SSO'};
  r.providers.forEach(p=>{
    const b=document.createElement('button');
    b.className='sso-btn';
    b.innerHTML=`${icons[p]||'🔐'} Continue with ${lbls[p]||p}`;
    b.onclick=()=>window.location=`${API}/api/v1/auth/oidc/${p}/start`;
    document.getElementById('sso').appendChild(b);
  });
})();
</script>
</body>
</html>
